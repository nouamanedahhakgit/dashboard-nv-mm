[app]
# live = Nevis APIs
# api_test = local saved API XML responses (not included in this repository)
# test = local Excel exports (not included in this repository)
mode = live
data_dir = data
unit_api_sample_file = data/unit_api_response.xml
vessel_api_sample_file = data/vessel_visit_api_response.xml

[api]
unit_url = http://navis.example.internal/apex/api/query?filtername=units_1&operatorId=YOUR_OPERATOR&complexId=YOUR_COMPLEX&facilityId=YOUR_FACILITY&yardId=YOUR_YARD
vessel_visit_url = http://navis.example.internal/apex/api/query?filtername=vesselVisits&operatorId=YOUR_OPERATOR&complexId=YOUR_COMPLEX&facilityId=YOUR_FACILITY&yardId=YOUR_YARD
phase = working

[auth]
# Keep real values only in nevis_api.ini. That file is ignored by Git.
username =
password =

[performance]
connect_timeout_seconds = 3
read_timeout_seconds = 45
retries = 0
workers = 1
cache_ttl_seconds = 300
stale_cache_minutes = 180
failure_backoff_seconds = 300
verify_ssl = true
